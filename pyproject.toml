[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus-plugin-dev"
version = "0.0.0"
description = "Dev tooling for the daedalus Claude Code plugin. Runtime is stdlib only."
requires-python = ">=3.12"
license = "GPL-3.0-or-later"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6", "mypy==2.4.0"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the claude CLI and spends tokens; deselected by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.mypy]
python_version = "3.12"
mypy_path = "scripts"
explicit_package_bases = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]
